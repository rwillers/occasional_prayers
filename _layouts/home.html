{% extends "_base.html" %}

{% block home %} 
{% endblock %}

{% block body %}

<p>{{this.tagline}}</p>

<h3>Find prayers</h3>

<ul>
	{% for item in this.content %}
	<li>
		<a href="{{item.url}}">{{item.title}}</a>
		{% if item.attribution %}
		<small><em>{{item.attribution}}</em></small>
		{% endif %}
	</li>
	{% endfor %}
</ul>

{% endblock %}
