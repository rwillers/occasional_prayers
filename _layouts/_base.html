<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{this.title}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-title" content="Prayers">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    {% set url_prefix = '' %}
    {% if site.baseurl %}
    {%   set url_prefix = '/' + site.baseurl %}
    {% endif %}
    <link rel="apple-touch-icon" href="{{url_prefix + '/images/touch-icon.png'}}">
    <link href="{{url_prefix + '/css/style.css'}}" rel="stylesheet" media="screen">
    
    <script>
var links = document.getElementsByTagName('a');
for(var i in links)
{
    links[i].onclick = function(e){
        e.preventDefault();
        window.location.href = this.href;
        return false;
    }
}
    </script>

    {% block head_addon %}
    {% endblock %} 
  </head>

  <body>

	<div class="navbar">
    <div class="inner">

    <h1><a href="{{url_prefix + '/'}}">{{site.brand}}</a></h1>

    {% block home %}
    {% endblock %}

    <form action="{{url_prefix + '/search.html'}}" role="search">
      <input type="text" required name="q" id="tipue_search_input" class="form-control" placeholder="Search"> 
    </form>

    </div>
	</div>
	
	<div id="content">

    {% block body %}
    {% endblock %}

    {% block body_addon %}
    {% endblock %} 

	</div>

  {% include 'footer.html' %}

  </body>
</html>
