name: Publish Site

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this revision to production"
        required: true
        default: false
        type: boolean

jobs:
  verify:
    name: Verify build and migration checks
    runs-on: ubuntu-latest
    env:
      PELICAN_PYTHON: python3
      PAGEFIND_CMD: npx --yes pagefind@1.4.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run test suite
        run: make test

      - name: Build Pelican + PageFind
        run: make build-pelican-search

      - name: Validate redirects
        run: make build-redirects

      - name: Generate cutover readiness report
        run: make cutover-readiness

      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: cutover-readiness
          path: migration/cutover_readiness.md

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: production
    if: >
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
      )
    concurrency:
      group: occasional-prayers-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    env:
      PELICAN_PYTHON: python3
      PAGEFIND_CMD: npx --yes pagefind@1.4.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Build deployable site
        run: |
          make build-pelican-search
          make build-redirects
          make cutover-readiness

      - name: Validate Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Missing required secrets: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_PAGES_PROJECT_NAME:-}" ]]; then
            echo "Missing required repository variable: CLOUDFLARE_PAGES_PROJECT_NAME"
            exit 1
          fi

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _build_pelican
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
            --branch=master
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-deploy smoke checks
        env:
          SITE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [[ -z "${SITE_URL:-}" ]]; then
            echo "Cloudflare Pages did not return a deployment URL"
            exit 1
          fi
          TMP_HTML="$(mktemp)"
          trap 'rm -f "$TMP_HTML"' EXIT
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "${SITE_URL}/search.html" -o "$TMP_HTML"
          grep -q "/pagefind/pagefind.js" "$TMP_HTML"
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSIL "${SITE_URL}/pagefind/pagefind.js" >/dev/null
          test "$(curl --retry 5 --retry-all-errors --retry-delay 2 -s -o /dev/null -w "%{http_code}" "${SITE_URL}/this-page-should-not-exist")" = "404"
