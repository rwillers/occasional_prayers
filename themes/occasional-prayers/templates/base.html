<!doctype html>
<html lang="en">
    <head>
        {% set url_prefix = SITEURL.rstrip('/') if SITEURL else '' %}
        <meta charset="utf-8">
        <title>{% if page is defined %}{{ page.title }}{% else %}{{ SITENAME }}{% endif %}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="apple-mobile-web-app-title" content="Prayers">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#d7cec7">
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111">
        <link rel="manifest" href="{{ url_prefix }}/manifest.json">
        <link rel="icon" type="image/png" href="{{ url_prefix }}/images/favicon-32.png">
        <link rel="apple-touch-icon" sizes="120x120" href="{{ url_prefix }}/images/touch-icon-120.png">
        <link rel="apple-touch-icon" sizes="152x152" href="{{ url_prefix }}/images/touch-icon-152.png">
        <link rel="apple-touch-icon" sizes="167x167" href="{{ url_prefix }}/images/touch-icon-167.png">
        <link rel="apple-touch-icon" sizes="180x180" href="{{ url_prefix }}/images/touch-icon-180.png">
        <link rel="apple-touch-icon" href="{{ url_prefix }}/images/touch-icon-1024.png">
        <link href="{{ url_prefix }}/css/style.css" rel="stylesheet" media="screen">
        <script defer src="https://cloud.umami.is/script.js" data-website-id="3f8ffc27-8bb4-4bdd-8baf-94c9ffd50464"></script>
        {% block head_addon %}{% endblock %}
    </head>

    <body>
        <div id="inner-body">
            <header>
                <div class="inner">
                    <h1><a href="{{ url_prefix }}/">{{ SITENAME }}</a></h1>

                    <form action="{{ url_prefix }}/search.html" role="search">
                        <input type="search" name="q" id="tipue_search_input" class="form-control" placeholder="Search" required minlength="3" validation="Use at least three characters">
                    </form>
                </div>
            </header>

            <main id="content"{% block content_attributes %}{% endblock %}>
                {% block body %}{% endblock %}
                {% block body_addon %}{% endblock %}
            </main>

            {% include "footer.html" %}
        </div>
    </body>
</html>
