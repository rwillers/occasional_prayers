<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>￼</title>
	</head>
	<body>


<canvas id="icon" width="1024" height="1024"></canvas>

<br><br>

<img class="output" width="1024" height="1024">

<br><br>

<canvas id="icon2" width="1024" height="1024"></canvas>

<br><br>

<img class="output2" width="1024" height="1024">


<script>

var c = document.getElementById('icon');
var ctx = c.getContext('2d');

// Background gradient
var bg = ctx.createLinearGradient(0, 0, 0, 1024);
bg.addColorStop(0, '#8f3d4c'); // mid: #76323f
bg.addColorStop(1, '#592630');
ctx.fillStyle = bg;
ctx.fillRect(0, 0, 1024, 1024);

// Cross
ctx.beginPath();
ctx.moveTo(344, 198);
ctx.lineTo(680, 198);
ctx.bezierCurveTo(812, 198, 560, 198, 560, 464);
ctx.bezierCurveTo(826, 464, 826, 212, 826, 344);
ctx.lineTo(826, 680);
ctx.bezierCurveTo(826, 812, 826, 560, 560, 560);
ctx.bezierCurveTo(560, 826, 812, 826, 680, 826);
ctx.lineTo(344, 826);
ctx.bezierCurveTo(212, 826, 464, 826, 464, 560);
ctx.bezierCurveTo(198, 560, 198, 812, 198, 680);
ctx.lineTo(198, 344);
ctx.bezierCurveTo(198, 212, 198, 464, 464, 464);
ctx.bezierCurveTo(464, 198, 212, 198, 344, 198);
ctx.closePath();
ctx.fillStyle = '#cdb298';
ctx.fill();

var img = c.toDataURL('image/png');
var imgs = document.getElementsByClassName('output');
for (var i = 0; i < imgs.length; i++) {
	imgs[i].src = img;
}


var c2 = document.getElementById('icon2');
var ctx2 = c2.getContext('2d');
ctx2.globalAlpha = 0.1;

// Cross
ctx2.beginPath();
ctx2.moveTo(344, 198);
ctx2.lineTo(680, 198);
ctx2.bezierCurveTo(812, 198, 560, 198, 560, 464);
ctx2.bezierCurveTo(826, 464, 826, 212, 826, 344);
ctx2.lineTo(826, 680);
ctx2.bezierCurveTo(826, 812, 826, 560, 560, 560);
ctx2.bezierCurveTo(560, 826, 812, 826, 680, 826);
ctx2.lineTo(344, 826);
ctx2.bezierCurveTo(212, 826, 464, 826, 464, 560);
ctx2.bezierCurveTo(198, 560, 198, 812, 198, 680);
ctx2.lineTo(198, 344);
ctx2.bezierCurveTo(198, 212, 198, 464, 464, 464);
ctx2.bezierCurveTo(464, 198, 212, 198, 344, 198);
ctx2.closePath();
ctx2.fillStyle = '#000';
ctx2.fill();

var img2 = c2.toDataURL('image/png');
var imgs2 = document.getElementsByClassName('output2');
for (var i = 0; i < imgs2.length; i++) {
	imgs2[i].src = img2;
}

</script>

	</body>
</html>
